<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TABLES</title>
</head>
<body>
    <table border="1">

        <thead>
            <tr>
                <th colspan="3">
                    Football Tournament
                </th>
            </tr>

            <tr>
                <th>Teams</th>
                <th>Wins</th>
                <th>Points</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Real Madrid</td>
                <td>20</td>
                <td>60</td>
            </tr>

            <tr>
                <td>Barcelona</td>
                <td>18</td>
                <td>54</td>
            </tr>

            <tr>
                <td>Arsenal</td>
                <td>15</td>
                <td>45</td>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <td colspan="3">
                    Total Teams: 3
                </td>
            </tr>
        </tfoot>
    </table>

    <hr>

    <table border="1"> 
        <thead>
            <tr>
                <th colspan="2">
                    My School Subjects
                </th>
            </tr>

            <tr>
                <td>Subject</td>
                <td>Teacher</td>
            </tr>
        </thead>

        <tbody>    
            <tr>
                <td>Math</td>
                <td>Mr. Smith</td>
            </tr>

            <tr>
                <td>English</td>
                <td>Mrs. Brown</td>
            </tr>
        </tbody>
    </table>
<hr>
    <table border="1">
        <thead>
            <tr>
                <th>Student</th>
                <th>Subject</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td rowspan="2">John</td>
                <td>Math</td>
            </tr>

            <tr>
                <td>English</td>
            </tr>

            <tr>
                <td>Emma</td>
                <td>Science</td>
            </tr>
        </tbody>
    </table>
<hr>
    <form>
        <input type="text" placeholder="Enter your name" value="Bakhtiyor">
        <input 
            type="email" 
            placeholder="Enter your email" 
            required
        >
        <input type="password" placeholder="Enter your password">
        <input type="date">
        <input type="submit" placeholder="Sign up">
        <input 
            type="text" 
            placeholder="your role is Client" 
            disabled
        >
    </form>
</body>
</html>
