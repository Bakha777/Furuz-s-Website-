<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice work day 14/07</title>
</head>
<body>
    <label for="username">
        Name:
    </label>
    <input
        type="text"
        id="username"
    >
    <label for="message">
        Message:
    </label>
    <textarea
        id="message"
        rows="4"
        cols="30"
    >
    </textarea>

    <label for="country">
        Country:
    </label>

    <select id="country">
        <option>Tajikistan</option>
        <option>Kazakhstan</option>
        <option>Uzbekistan</option>
    </select>
    <button>Send</button>
</body>
</html>
